<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bozor ro'yxati</title>
<style>
:root{--bg:#F3F4F7;--card:#fff;--ink:#1B1F2A;--muted:#667085;--line:#E0E3EA;--accent:#E4572E;--onacc:#fff;--new:#2563EB;--newbg:#E8EFFF;--red:#C62828;--sh:0 1px 3px rgba(20,25,40,.08);

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;max-width:640px;margin:0 auto}
.bar h1{font-size:24px;margin:0;letter-spacing:-.02em}
.bar .sub{color:var(--muted);font-size:14px}
main{max-width:640px;margin:0 auto;padding:4px 16px calc(170px + env(safe-area-inset-bottom,0px))}
input,button,select{font:inherit;color:inherit}
input[type=search],input[type=number],input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:var(--onacc);font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
button.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
button.wide{width:100%;margin-top:12px}
button.ic{padding:9px;border-radius:50%;background:transparent;color:var(--muted)}
button.ic:hover{color:var(--red)}
button.addb{width:44px;height:44px;padding:0;border-radius:50%;background:var(--accent);color:var(--onacc);flex:none}
ul{list-style:none;margin:0;padding:0}
[hidden]{display:none!important}
.sbox{position:relative}
.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox input{height:54px;padding-left:46px;font-size:17px;border-radius:14px;box-shadow:var(--sh)}
.hint{color:var(--muted);font-size:14px;margin:14px 4px 0}
.res{margin-top:12px;background:var(--card);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.res li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;min-height:64px}
.res li+li{border-top:1px solid var(--line)}
.res li.new{background:var(--newbg)}
.res .l{min-width:0}
.res .l b{font-weight:600;display:block;overflow-wrap:anywhere}
.res .p{color:var(--muted);font-size:13px}
.res .in{color:var(--accent);font-weight:600;margin-left:8px}
.tag{display:inline-block;background:var(--new);color:var(--card);font-size:12px;font-weight:700;border-radius:6px;padding:0 7px;margin-left:8px;vertical-align:middle}
.none{padding:16px;color:var(--muted)}
.np{background:var(--card);border:2px solid var(--new);border-radius:14px;padding:16px;margin-top:14px}
.np h3{margin:0 0 6px;font-size:18px}
.np label{display:block;font-size:13px;color:var(--muted);margin-top:10px;margin-bottom:3px}
.np select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.np .row{margin-top:16px}
.empty2{text-align:center;color:var(--muted);padding:48px 16px}
.empty2 p{margin:0 0 16px;font-size:17px}
.basket li{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.basket li.new{border-left:5px solid var(--new);background:var(--newbg)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ti{min-width:0}
.nm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.codes{display:block;font-size:13px;color:var(--muted)}
.codes span{margin-right:12px}
.act{display:flex;gap:6px;align-items:center;flex:none}
button.danger{background:var(--red);color:#fff;padding:8px 12px}
button.sm2{padding:8px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.f.q{grid-column:1/-1}
.lb{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.qs{display:flex;gap:8px;align-items:center}
.qs .qy{width:92px;text-align:center;padding:10px 6px;font-weight:700}
.qs select{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px 8px}
button.st{width:46px;height:46px;padding:0;font-size:24px;line-height:1;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;flex:none}
.grid input{padding:11px}
.sm{margin-top:12px;font-weight:700;display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.sm:empty{display:none}
.note{color:var(--muted);font-size:13px;margin:14px 2px 0}
.sumbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:6;max-width:640px;margin:0 auto;padding:0 12px}
.sumin{background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 16px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.s1{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.s1 b{font-size:21px}
.s2{display:flex;justify-content:space-between;font-size:14px;opacity:.85;margin-top:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{background:transparent;color:var(--muted);flex-direction:column;gap:2px;border-radius:0;font-size:13px;padding:8px 0;height:62px;position:relative}
.tab[aria-current=page]{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--onacc);font-size:12px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1}
@keyframes inR{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
.inR{animation:inR .22s ease-out}.inL{animation:inL .22s ease-out}
@media (prefers-reduced-motion:reduce){.inR,.inL{animation:none}}
</style>

  const found=all().filter(i=>i.name.toLowerCase().includes(q)||(i.sku&&i.sku.includes(q))||(i.barcode&&i.barcode.includes(q))).slice(0,40);
  found.forEach(i=>{
    const li=document.createElement('li');if(i.isNew)li.className='new';
    const l=document.createElement('div');l.className='l';
    const b=document.createElement('b');b.textContent=i.name;if(i.isNew)b.appendChild(badge());
    const p=document.createElement('span');p.className='p';p.textContent=i.unit;
    if(basket.some(x=>x.name===i.name)){const s=document.createElement('span');s.className='in';s.textContent='Savatda';p.appendChild(s)}
    l.append(b,p);
    const btn=document.createElement('button');btn.className='addb';btn.innerHTML=PLUS;btn.setAttribute('aria-label',i.name+" ni savatchaga qo'shish");
    btn.onclick=()=>{$('#q').value='';renderRes();add(i)};
    li.append(l,btn);ul.appendChild(li);
  });
  if(!found.length){
    const li=document.createElement('li');li.className='none';li.style.display='block';
    li.textContent='Bazada topilmadi. Pastdagi "Yangi tovar qo\'shish" tugmasidan foydalaning.';
    ul.appendChild(li);
  }
}

function add(i,price){
  let it=basket.find(x=>x.name===i.name);
  if(it)it.qty+=1;else{it={name:i.name,unit:i.unit,price:price||0,sell:0,qty:1,sku:i.sku||'',barcode:i.barcode||'',isNew:!!i.isNew};basket.unshift(it)}
  save('bz_basket',basket);renderBasket();say(i.name+" savatchaga qo'shildi");
  nav('p2');focusQty(it);
}
function focusQty(it){const li=$('#basket').children[basket.indexOf(it)];if(!li)return;const q=li.querySelector('.qy');q.focus();q.select()}
const sumOf=x=>(+x.qty||0)*(+x.price||0);
const sellOf=x=>(+x.qty||0)*(+x.sell||0);
function lookup(x){const f=all().find(i=>i.name===x.name)||{};return {sku:x.sku||f.sku||'',barcode:x.barcode||f.barcode||''}}
function updTotal(){
  const buy=basket.reduce((s,x)=>s+sumOf(x),0),sell=basket.reduce((s,x)=>s+sellOf(x),0);
  const prof=basket.reduce((s,x)=>x.sell?s+(+x.qty||0)*((+x.sell||0)-(+x.price||0)):s,0);
  const two=!$('#p2').hidden;
  $('#tb').textContent=fmt(buy);$('#s2').hidden=!sell;$('#ts').textContent=fmt(sell);$('#tp').textContent=fmt(prof);
  $('#sumbar').hidden=!(two&&basket.length);
  $('#bd').hidden=!basket.length;$('#bd').textContent=basket.length;
  $('#cnt').textContent=two&&basket.length?basket.length+' ta tovar':'';
  $('#emp').hidden=!!basket.length;$('#acts').hidden=!basket.length;
}
const smText=x=>[x.price?'Kelish: '+fmt(sumOf(x)):'',x.sell?'Sotish: '+fmt(sellOf(x)):''].filter(Boolean).join('   ');

function renderBasket(){
  const ul=$('#basket');ul.innerHTML='';
  basket.forEach(x=>{
    const li=document.createElement('li');if(x.isNew)li.className='new';
    li.innerHTML=`<div class="top"><div class="ti"><span class="nm"></span><span class="codes"></span></div><div class="act"></div></div>
<div class="grid">
<div class="f q"><span class="lb">Miqdor</span><div class="qs"><button class="st mi" aria-label="Kamaytirish">−</button><input class="qy" type="number" inputmode="decimal" min="0" step="0.5" aria-label="Miqdor"><button class="st pl" aria-label="Ko'paytirish">+</button><select class="un" aria-label="Birlik"><option>kg</option><option>dona</option></select></div></div>
<div class="f"><label class="lb">Kelish narxi</label><input class="pr" type="number" inputmode="numeric" min="0" step="100"></div>
<div class="f"><label class="lb">Sotish narxi</label><input class="sl" type="number" inputmode="numeric" min="0" step="100" placeholder="ixtiyoriy"></div>
</div><div class="sm"></div>`;
    const nm=li.querySelector('.nm');nm.textContent=x.name;if(x.isNew)nm.appendChild(badge());
    const c=lookup(x),cd=li.querySelector('.codes');
    [c.sku&&'SKU: '+c.sku,c.barcode&&'Shtrix: '+c.barcode].filter(Boolean).forEach(t=>{const sp=document.createElement('span');sp.textContent=t;cd.appendChild(sp)});
    const un=li.querySelector('.un'),qy=li.querySelector('.qy'),pr=li.querySelector('.pr'),sl=li.querySelector('.sl'),sm=li.querySelector('.sm'),act=li.querySelector('.act');
    if(![...un.options].some(o=>o.value===x.unit))un.add(new Option(x.unit));
    un.value=x.unit;qy.value=x.qty;pr.value=x.price||0;sl.value=x.sell||'';sm.textContent=smText(x);
    [qy,pr,sl].forEach(e=>e.addEventListener('focus',()=>e.select()));
    const upd=()=>{x.qty=parseFloat(qy.value)||0;x.price=parseFloat(pr.value)||0;x.sell=parseFloat(sl.value)||0;sm.textContent=smText(x);updTotal();save('bz_basket',basket)};
    qy.oninput=upd;pr.oninput=upd;sl.oninput=upd;
    un.onchange=()=>{x.unit=un.value;save('bz_basket',basket)};
    const step=()=>x.unit==='dona'?1:0.5;
    li.querySelector('.mi').onclick=()=>{qy.value=Math.max(0,Math.round(((parseFloat(qy.value)||0)-step())*100)/100);upd()};
    li.querySelector('.pl').onclick=()=>{qy.value=Math.round(((parseFloat(qy.value)||0)+step())*100)/100;upd()};
    let tm;
    const showTrash=()=>{
      clearTimeout(tm);act.innerHTML='';
      const t=document.createElement('button');t.className='ic';t.innerHTML=TRASH;t.setAttribute('aria-label',"O'chirish");t.title="O'chirish";
      t.onclick=showAsk;act.appendChild(t);
    };
    const showAsk=()=>{
      act.innerHTML='';
      const y=document.createElement('button');y.className='danger';y.textContent="O'chirish";
      const n=document.createElement('button');n.className='ghost sm2';n.textContent='Bekor';
      y.onclick=()=>{basket=basket.filter(z=>z!==x);save('bz_basket',basket);renderBasket()};
      n.onclick=showTrash;act.append(y,n);tm=setTimeout(showTrash,5000);
    };
    showTrash();
    ul.appendChild(li);
  });
  updTotal();
}

function openPanel(name){
  $('#np').hidden=false;$('#nn').value=name||'';$('#npr').value='';$('#nu').value='kg';
  $('#np').scrollIntoView({behavior:'smooth',block:'center'});$('#nn').focus();
}
$('#newbtn').onclick=()=>openPanel($('#q').value.trim());
$('#ncancel').onclick=()=>{$('#np').hidden=true};
$('#nsave').onclick=()=>{
  const name=$('#nn').value.trim();if(!name){say('Tovar nomini yozing');$('#nn').focus();return}
  const ex=all().find(i=>i.name.toLowerCase()===name.toLowerCase());
  if(ex)add(ex);
  else{const it={name,unit:$('#nu').value,price:0,sku:'',barcode:'',isNew:true};custom.unshift(it);save('bz_custom',custom);add(it,parseFloat($('#npr').value)||0)}
  $('#np').hidden=true;$('#q').value='';renderRes();
};

$('#xl').onclick=()=>{
  if(!basket.length){say("Savatcha bo'sh");return}
  const head=['№','Tovar nomi','Shtrix kod','SKU','Miqdor','Birlik','Kelish narxi','Kelish summasi','Sotish narxi','Sotish summasi','Holati'];
  const rows=basket.map((x,i)=>{const c=lookup(x);return [i+1,x.name,c.barcode,c.sku,x.qty,x.unit,x.price||0,Math.round(sumOf(x)),x.sell||'',x.sell?Math.round(sellOf(x)):'',x.isNew?'Yangi tovar':'']});
  const buy=basket.reduce((s,x)=>s+sumOf(x),0),sell=basket.reduce((s,x)=>s+sellOf(x),0);
  const aoa=[head,...rows,['','Jami','','','','','',Math.round(buy),'',sell?Math.round(sell):'','']];
  const d=new Date(),fn='bozor-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{
    if(typeof XLSX==='undefined')throw 0;
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:4},{wch:34},{wch:16},{wch:10},{wch:9},{wch:8},{wch:13},{wch:15},{wch:13},{wch:15},{wch:12}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Bozor');
    XLSX.writeFile(wb,fn+'.xlsx');say('Excel fayl saqlandi');
  }catch(e){
    const csv='\ufeff'+aoa.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fn+'.csv';a.click();say('CSV fayl saqlandi (Excel ochadi)');
  }
};
$('#clear').onclick=()=>{if(basket.length&&confirm('Savatchani tozalaysizmi?')){basket=[];save('bz_basket',basket);renderBasket()}};
$('#q').addEventListener('input',renderRes);
const keep=()=>{save('bz_basket',basket);save('bz_custom',custom)};
addEventListener('pagehide',keep);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')keep()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
renderBasket();route();
</script>
</body>
</html>
