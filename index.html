<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bozor ro'yxati</title>
<style>
:root{--bg:#EEF3EC;--card:#FFFFFF;--ink:#16241A;--muted:#5C6E60;--line:#CFDACD;--accent:#2F7D3A;--onacc:#fff;--red:#B3362A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A13;--card:#18261C;--ink:#E6F0E7;--muted:#9BB09F;--line:#2A3D2E;--accent:#6CC17A;--onacc:#0C1A10;--red:#F08A7E}}
:root[data-theme="dark"]{--bg:#101A13;--card:#18261C;--ink:#E6F0E7;--muted:#9BB09F;--line:#2A3D2E;--accent:#6CC17A;--onacc:#0C1A10;--red:#F08A7E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:26px;margin:4px 0 16px;letter-spacing:-.02em}
h2{font-size:18px;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--muted);font-size:14px}
input,textarea,button{font:inherit;color:inherit}
input[type=search],input[type=number],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--onacc);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.del{background:transparent;color:var(--red);padding:4px 8px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
.res{margin-top:10px;background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.res li button{width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;background:transparent;color:var(--ink);border-radius:0;border-top:1px solid var(--line);padding:13px 14px;font-weight:500}
.res li:first-child button{border-top:0}
.res li button:hover{background:var(--bg)}
.res .p{color:var(--muted);white-space:nowrap}
.res .add{color:var(--accent);font-weight:700}
.empty{padding:14px;color:var(--muted)}
.basket li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ctl label{font-size:13px;color:var(--muted);display:block}
.ctl select{margin-left:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:1px 4px}
.ctl input{margin-top:3px;padding:9px 10px}
.sum{grid-column:1/-1;text-align:right;font-weight:700}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:26px}
summary{cursor:pointer;font-weight:700}
details p{color:var(--muted);font-size:14px;margin:10px 0}
textarea{min-height:140px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
.msg{color:var(--accent);font-size:14px;min-height:20px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>Bozor ro'yxati</h1>

<input id="q" type="search" placeholder="Tovar nomini yozing (masalan: olma)" aria-label="Tovar qidirish" autocomplete="off">
<ul class="res" id="res" hidden></ul>

<h2>Savatcha <small id="cnt"></small></h2>
<ul class="basket" id="basket"></ul>
<div class="total"><span>Jami</span><span id="total">0 so'm</span></div>
<div class="row">
  <button id="copy">Ro'yxatni nusxalash</button>
  <button id="clear" class="ghost">Savatchani tozalash</button>
</div>
<div class="msg" id="msg" role="status"></div>

<details>
  <summary>Tovarlar bazasi (<span id="bcnt">0</span> ta)</summary>
  <p>Har qatorga bitta tovar: <b>nomi, narxi, birligi</b>. Masalan: <i>Olma, 8000, kg</i>. Narx va birlik yozilmasa ham bo'ladi. Excel'dagi bazani CSV qilib saqlab yuklang yoki matnni shu yerga qo'ying.</p>
  <textarea id="bt" aria-label="Baza matni" placeholder="Olma, 8000, kg&#10;Banan, 18000, kg&#10;Limon, 15000, kg"></textarea>
  <div class="row" style="margin-top:10px">
    <button id="apply">Bazani saqlash</button>
    <button id="file" class="ghost">CSV fayl yuklash</button>
    <input id="fi" type="file" accept=".csv,.txt,text/csv,text/plain" hidden>
  </div>
</details>
</div>

<script>
const DEFAULT_TEXT=`Yalpiz Dona, 1000, dona
Selder Dona, 2000, dona
Petrushka dona, 1400, dona
Rukola dona, 1333, dona
Salat bargi dona, 4000, dona

Bolgarskiy kg Kalif. Qizil, 25000, kg
Baqlajon kg, 4500, kg

Kapusta bryuselsskaya kg, 30000, kg

Mango 1d Katta, 35000, dona

Olma Granny Smith kg, 25000, kg
Pomidor kg Pushti, 17500, kg

Jandiq dona / Janduq dona, 5000, dona
O'rik kg danak mag'iz, 55000, kg
Osh Nabor, 10000, dona

Nok Dyushes Kg, 30000, kg
Малина (125)гр, 30000, dona
Ежевика Driscoll's 125гр, 55000, dona

Kartoshka kg Sariq, 5000, kg

Salat bargi Lollo Rosso dona, 5000, dona
Piyoz Parey kg, 20000, kg

Oq Piyoz kg, 5000, kg

Aysberg dona, 8000, dona
Brokkoli karam kg, 25000, kg
Chesnok kg tozalangan, 15000, kg
Qalampir kg Garimdori kg Dungan, 30000, kg
Sabzi qizil kg Yuvilgan, 8000, kg
Shavel dona / Щавель шт / Ot quloq, 7500, dona
Sabzi qizil kg yuvilmagan, 7000, kg
Rediska dona, 5000, dona
Krasniy peres Ostriy kg, 20000, kg
Oq Turp Daykon Kg, 10000, kg
Meva Fizalis GoldenBerries, 45000, dona
Jo'xori 1d, 3000, dona
Mango kg/Манго сушёный вес, 80000, kg
Imbir kg, 35000, kg
Qalampir sht, 2000, dona
Kokos 1d, 30000, dona
Muzlatilgan Oblepixa (10kg) kg, 80000, kg
Muzlatilgan Klyukva (10kg) kg, 100000, kg
Muzlatilgan Chernika (10kg) kg, 110000, kg`;
const $=s=>document.querySelector(s);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let base=load('bz_base2',null)||parse(DEFAULT_TEXT), basket=load('bz_basket',[]);
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+" so'm";
const say=t=>{$('#msg').textContent=t;setTimeout(()=>{if($('#msg').textContent===t)$('#msg').textContent=''},2500)};

function parse(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/[;\t,]/).map(s=>s.trim());let price=0,unit='kg';
    for(const x of p.slice(1)){ if(/^[\d\s.]+$/.test(x)&&x!=='')price=parseFloat(x.replace(/\s/g,'')); else if(x)unit=x }
    return {name:p[0],price,unit};
  }).filter(i=>i.name&&!/^(nom|nomi|name|tovar)$/i.test(i.name));
}
const toText=()=>base.map(i=>[i.name,i.price||'',i.unit].join(', ')).join('\n');

function renderRes(){
  const q=$('#q').value.trim().toLowerCase(), ul=$('#res'); ul.innerHTML='';
  if(!q){ul.hidden=true;return}
  ul.hidden=false;
  const found=base.filter(i=>i.name.toLowerCase().includes(q)).slice(0,40);
  found.forEach(i=>{
    const li=document.createElement('li'),b=document.createElement('button');
    const n=document.createElement('span');n.textContent=i.name;
    const r=document.createElement('span');r.className='p';
    r.textContent=(i.price?fmt(i.price)+' / ':'')+i.unit+'  ';
    const a=document.createElement('span');a.className='add';a.textContent='+ Qo\'shish';r.appendChild(a);
    b.append(n,r);b.onclick=()=>{add(i);$('#q').value='';renderRes();$('#q').focus()};
    li.appendChild(b);ul.appendChild(li);
  });
  if(!found.length){
    const li=document.createElement('li'),b=document.createElement('button');
    b.textContent='Bazada topilmadi. "'+$('#q').value.trim()+'" ni qo\'lda qo\'shish';
    b.onclick=()=>{add({name:$('#q').value.trim(),price:0,unit:'kg'});$('#q').value='';renderRes()};
    li.appendChild(b);ul.appendChild(li);
  }
}

function add(i){
  const ex=basket.find(x=>x.name===i.name);
  if(ex)ex.qty+=1; else basket.push({name:i.name,unit:i.unit,price:i.price||0,qty:1});
  save('bz_basket',basket);renderBasket();say(i.name+' savatchaga qo\'shildi');
}

function sumOf(x){return (+x.qty||0)*(+x.price||0)}
function updTotal(){$('#total').textContent=fmt(basket.reduce((s,x)=>s+sumOf(x),0));$('#cnt').textContent=basket.length?basket.length+' ta tovar':''}

function renderBasket(){
  const ul=$('#basket');ul.innerHTML='';
  if(!basket.length){const li=document.createElement('li');li.className='empty';li.style.border='0';li.style.background='transparent';li.textContent="Savatcha bo'sh. Yuqoridan tovar qidiring.";ul.appendChild(li)}
  basket.forEach((x,idx)=>{
    const li=document.createElement('li');
    li.innerHTML='<div class="top"><span></span><button class="del">O\'chirish</button></div><div class="ctl"><label>Miqdor <select class="un" aria-label="Birlik"><option>kg</option><option>dona</option></select><input type="number" inputmode="decimal" min="0" step="0.5" class="qy"></label><label>Narxi (so\'m)<input type="number" inputmode="numeric" min="0" step="100" class="pr"></label><div class="sum"></div></div>';
    li.querySelector('.top span').textContent=x.name;
    const un=li.querySelector('.un');if(![...un.options].some(o=>o.value===x.unit))un.add(new Option(x.unit));un.value=x.unit;un.onchange=()=>{x.unit=un.value;save('bz_basket',basket)};
    const qy=li.querySelector('.qy'),pr=li.querySelector('.pr'),sm=li.querySelector('.sum');
    qy.value=x.qty;pr.value=x.price||'';
    const upd=()=>{x.qty=parseFloat(qy.value)||0;x.price=parseFloat(pr.value)||0;sm.textContent=x.price?fmt(sumOf(x)):'';updTotal();save('bz_basket',basket)};
    qy.oninput=upd;pr.oninput=upd;sm.textContent=x.price?fmt(sumOf(x)):'';
    li.querySelector('.del').onclick=()=>{basket.splice(idx,1);save('bz_basket',basket);renderBasket()};
    ul.appendChild(li);
  });
  updTotal();
}

function listText(){
  const lines=basket.map((x,i)=>(i+1)+'. '+x.name+' — '+x.qty+' '+x.unit+(x.price?' × '+Math.round(x.price)+' = '+fmt(sumOf(x)):''));
  return lines.join('\n')+'\n\nJami: '+$('#total').textContent;
}
$('#copy').onclick=async()=>{
  if(!basket.length){say("Savatcha bo'sh");return}
  const t=listText();
  try{await navigator.clipboard.writeText(t);say('Ro\'yxat nusxalandi')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');say('Ro\'yxat nusxalandi')}catch(_){say('Nusxalab bo\'lmadi')}ta.remove()}
};
$('#clear').onclick=()=>{if(basket.length&&confirm('Savatchani tozalaysizmi?')){basket=[];save('bz_basket',basket);renderBasket()}};
$('#q').addEventListener('input',renderRes);
$('#apply').onclick=()=>{const b=parse($('#bt').value);if(!b.length){say("Baza bo'sh yoki o'qib bo'lmadi");return}base=b;save('bz_base2',base);$('#bcnt').textContent=base.length;say(base.length+' ta tovar saqlandi')};
$('#file').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bt').value=r.result;$('#apply').click()};r.readAsText(f)};
$('#bt').value=toText();$('#bcnt').textContent=base.length;
renderBasket();
</script>
</body>
</html>
